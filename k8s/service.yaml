apiVersion: v1
kind: Service
metadata:
  name: orneur-api
spec:
  selector:
    app: orneur-api
  ports:
  - port: 80
    targetPort: 7337
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ollama
spec:
  selector:
    app: ollama
  ports:
  - port: 11434
    targetPort: 11434
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orneur-api-ingress
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
  # Public domain is deliberately NOT hardcoded here -- docs/orneur/phase-0/
  # BRAND_MIGRATION_PLAN.md found THREE historical domains already in play
  # (atheris.ai, orca.systems, orca.ai) and no canonical one has been
  # confirmed by the project owner yet. Replace this placeholder with your
  # actual domain at deploy time; do not invent one.
  - host: "<YOUR_DOMAIN_HERE>"
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: orneur-api
            port:
              number: 80
