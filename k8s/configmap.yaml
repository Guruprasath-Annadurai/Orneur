apiVersion: v1
kind: ConfigMap
metadata:
  name: atheris-config
data:
  # Real bug this fixes: these previously pointed at raw, un-fine-tuned
  # base models — a real deployment via these manifests would have
  # silently served generic Qwen2.5, not Orca's actual fine-tuned models.
  # Matches the real production aliases (see orca/train/variants.py).
  core-model:  "orca-core"
  nano-model:  "orca-nano"
  ultra-model: "orca-ultra"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atheris-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ollama-pvc
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 50Gi
---
# Create this secret before deploying:
# kubectl create secret generic atheris-secrets --from-literal=auth-secret=$(openssl rand -hex 32)
apiVersion: v1
kind: Secret
metadata:
  name: atheris-secrets
type: Opaque
stringData:
  auth-secret: "REPLACE_WITH_STRONG_SECRET"
