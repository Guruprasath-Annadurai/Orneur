apiVersion: apps/v1
kind: Deployment
metadata:
  name: orneur-api
  labels:
    app: orneur-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orneur-api
  template:
    metadata:
      labels:
        app: orneur-api
    spec:
      # Non-root (UID/GID 10001). fsGroup makes the PVC group-accessible; the init container re-owns
      # data written by an older root-running image (see docs/orneur/status/CONTAINER_NON_ROOT_MIGRATION.md)
      # because the application refuses a state directory it does not own.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
      - name: fix-data-ownership
        image: orneur-api:latest
        imagePullPolicy: IfNotPresent
        command:
        - sh
        - -c
        - |
          if [ -n "$(find /data -xdev ! -uid 10001 -print -quit)" ]; then chown -R 10001:10001 /data; fi
          chmod 0700 /data
        securityContext:
          runAsNonRoot: false
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
            add: ["CHOWN", "FOWNER", "DAC_OVERRIDE"]
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: orneur-api
        image: orneur-api:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        ports:
        - containerPort: 7337
        env:
        - name: ORNEUR_OLLAMA_HOST
          value: "http://ollama:11434"
        - name: ORNEUR_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: orneur-api-secrets
              key: auth-secret
        - name: ORNEUR_CORE_MODEL
          valueFrom:
            configMapKeyRef:
              name: orneur-api-config
              key: core-model
        - name: ORNEUR_NANO_MODEL
          valueFrom:
            configMapKeyRef:
              name: orneur-api-config
              key: nano-model
        - name: ORNEUR_ULTRA_MODEL
          valueFrom:
            configMapKeyRef:
              name: orneur-api-config
              key: ultra-model
        volumeMounts:
        - name: data
          mountPath: /home/orneur/.orca
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        # Phase 14 §18-19 gap this closes: liveness and readiness previously
        # both hit /healthz (which itself did dependency checks) — a slow
        # DEPENDENCY (e.g. Ollama) could get a perfectly-alive pod killed
        # and restarted by Kubernetes, which never fixes a dependency
        # problem and adds restart churn on top of it. /livez does no I/O
        # and no dependency check (see orca/serve/api.py); /readyz checks
        # dependencies and is what actually gates traffic routing.
        # /healthz is preserved as an alias to /readyz for callers not yet
        # migrated to the split endpoints (see docs/orneur/phase-14/HEALTH_AND_READINESS.md).
        livenessProbe:
          httpGet:
            path: /livez
            port: 7337
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /readyz
            port: 7337
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: orneur-api-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "8Gi"
          limits:
            memory: "16Gi"
          # GPU: uncomment after installing nvidia-device-plugin
          # limits:
          #   nvidia.com/gpu: "1"
        # Real gap this closes: this deployment had NO probes at all —
        # Kubernetes had no way to know if Ollama was actually up, so a
        # crashed or still-initializing Ollama pod would keep receiving
        # traffic/be considered healthy indefinitely.
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-pvc
