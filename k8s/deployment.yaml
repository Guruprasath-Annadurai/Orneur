apiVersion: apps/v1
kind: Deployment
metadata:
  name: atheris
  labels:
    app: atheris
spec:
  replicas: 1
  selector:
    matchLabels:
      app: atheris
  template:
    metadata:
      labels:
        app: atheris
    spec:
      containers:
      - name: atheris
        image: atheris:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 7337
        env:
        - name: ORCA_OLLAMA_HOST
          value: "http://ollama:11434"
        - name: ORCA_AUTH_SECRET
          valueFrom:
            secretKeyRef:
              name: atheris-secrets
              key: auth-secret
        - name: ORCA_CORE_MODEL
          valueFrom:
            configMapKeyRef:
              name: atheris-config
              key: core-model
        - name: ORCA_NANO_MODEL
          valueFrom:
            configMapKeyRef:
              name: atheris-config
              key: nano-model
        - name: ORCA_ULTRA_MODEL
          valueFrom:
            configMapKeyRef:
              name: atheris-config
              key: ultra-model
        volumeMounts:
        - name: data
          mountPath: /root/.orca
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "2000m"
        # Real gap this closes: livenessProbe previously hit /api/status —
        # the HEAVY status endpoint, not the lightweight /healthz built
        # specifically for this (see docs/RUNBOOK.md's distinction between
        # the two). Repeatedly hitting the heavy endpoint every 30s adds
        # real load, and a slowdown IN that endpoint could get a perfectly
        # healthy pod killed by Kubernetes. There was also no readinessProbe
        # at all — without one, Kubernetes can route real traffic to a pod
        # that's started but not yet actually able to serve (e.g. before
        # its Ollama connection is established).
        livenessProbe:
          httpGet:
            path: /healthz
            port: 7337
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: 7337
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: atheris-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ollama
  labels:
    app: ollama
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ollama
  template:
    metadata:
      labels:
        app: ollama
    spec:
      containers:
      - name: ollama
        image: ollama/ollama:latest
        ports:
        - containerPort: 11434
        volumeMounts:
        - name: models
          mountPath: /root/.ollama
        resources:
          requests:
            memory: "8Gi"
          limits:
            memory: "16Gi"
          # GPU: uncomment after installing nvidia-device-plugin
          # limits:
          #   nvidia.com/gpu: "1"
        # Real gap this closes: this deployment had NO probes at all —
        # Kubernetes had no way to know if Ollama was actually up, so a
        # crashed or still-initializing Ollama pod would keep receiving
        # traffic/be considered healthy indefinitely.
        livenessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 20
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /api/tags
            port: 11434
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
      volumes:
      - name: models
        persistentVolumeClaim:
          claimName: ollama-pvc
