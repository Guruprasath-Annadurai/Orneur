name: Phase 15 Relay Live-Neon Qualification

# Manual only. Deliberately FOCUSED (spec section 26, Phase 15.12
# item 26): checkout + Python setup + install + fail-closed mission-DB
# secret preflight + the actual Phase 15.11/15.12 Relay pytest suite,
# nothing else. No Northflank login, no Phase 14 staging deploy, no
# unrelated step that could turn a genuinely successful Relay
# qualification into a job the whole-job `conclusion` reports as
# failed for a reason that has nothing to do with Relay or Neon --
# exactly the ambiguity Phase 15.11.2 discovered in the shared
# phase14b-distributed-qualification.yml workflow.
on:
  workflow_dispatch:
    inputs:
      suite:
        description: "Which Phase 15 Relay live-Neon suite to run."
        required: false
        default: "relay_15_12"
        type: choice
        options: ["relay_15_12", "relay_15_11"]

permissions:
  contents: read

concurrency:
  group: phase15-relay-security-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Relay live-Neon qualification (focused, no Northflank)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: phase14b-staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ORNEUR (no local persistence)
        run: |
          pip install --no-cache-dir -e ".[postgres]"
          pip install --no-cache-dir pytest

      - name: "Fail closed if mission DB secrets are missing (15.11.2 invariant, preserved here)"
        run: |
          set -euo pipefail
          missing=""
          if [ -z "$ORNEUR_MISSION_DATABASE_URL" ]; then missing="$missing ORNEUR_MISSION_DATABASE_URL"; fi
          if [ -z "$ORNEUR_MISSION_DATABASE_URL_DIRECT" ]; then missing="$missing ORNEUR_MISSION_DATABASE_URL_DIRECT"; fi
          if [ -n "$missing" ]; then
            echo "::error::This Relay live-Neon qualification requires a real disposable-Neon-branch connection string in EACH of: ORNEUR_MISSION_DATABASE_URL, ORNEUR_MISSION_DATABASE_URL_DIRECT. Missing/empty:$missing. Refusing to run."
            exit 1
          fi
          echo "Mission DB secrets present (values not printed) -- qualification may proceed."
        env:
          ORNEUR_MISSION_DATABASE_URL: ${{ secrets.ORNEUR_MISSION_DATABASE_URL }}
          ORNEUR_MISSION_DATABASE_URL_DIRECT: ${{ secrets.ORNEUR_MISSION_DATABASE_URL_DIRECT }}

      - name: "Phase 15.12 Relay Security Modes -- capability policy, reauthentication, session security, Mobile Review, authority non-bypass, secret battery (all 3 modes) against a disposable Neon branch, never production"
        if: github.event.inputs.suite == 'relay_15_12' || github.event.inputs.suite == ''
        run: |
          python -m pytest tests/test_relay_security.py tests/test_relay_security_live_neon.py tests/test_relay_store.py tests/test_relay_store_live_neon.py tests/test_relay_requirements.py tests/test_ci_live_neon_fail_closed.py -v
        env:
          ORNEUR_MISSION_DATABASE_URL: ${{ secrets.ORNEUR_MISSION_DATABASE_URL }}
          ORNEUR_MISSION_DATABASE_URL_DIRECT: ${{ secrets.ORNEUR_MISSION_DATABASE_URL_DIRECT }}

      - name: "Phase 15.11 Relay core only (device/session core, no security-mode layer)"
        if: github.event.inputs.suite == 'relay_15_11'
        run: |
          python -m pytest tests/test_relay_store.py tests/test_relay_store_live_neon.py tests/test_relay_requirements.py -v
        env:
          ORNEUR_MISSION_DATABASE_URL: ${{ secrets.ORNEUR_MISSION_DATABASE_URL }}
          ORNEUR_MISSION_DATABASE_URL_DIRECT: ${{ secrets.ORNEUR_MISSION_DATABASE_URL_DIRECT }}
