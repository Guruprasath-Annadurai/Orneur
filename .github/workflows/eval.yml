name: Model Eval (authorization-gated, manual dispatch only)

# MODEL EXECUTION BOUNDARY. Nothing in this file runs on push, pull_request or schedule: ordinary repository activity can never invoke a model.
# A dispatch first passes the `authorize` job (GitHub-hosted, no model, no secrets): it verifies the committed authorization record
# (docs/orneur/authorization/MODEL_EVAL_AUTHORIZATION.json) against THIS exact request (commit SHA, eval version, candidate, stage, runner class,
# purpose, GPU/provider flags, expiry, run/spend limits, signature by a registered authority key). The committed record is NOT_AUTHORIZED and no
# authority key is registered, so the gate denies and the self-hosted `eval` job is never queued. Static CPU data checks live in
# eval-static-checks.yml and never touch a model.
on:
  workflow_dispatch:
    inputs:
      authorization_id: {description: "Authorization id (must equal the committed, signed record)", required: true}
      eval_version: {description: "Eval version being run", required: true}
      candidate_model_id: {description: "Candidate model id", required: true}
      candidate_revision: {description: "Candidate revision (exact)", required: true}
      stage: {description: "STAGE_0 | STAGE_1 | STAGE_2 | STAGE_3", required: true}
      runner_class: {description: "GITHUB_HOSTED_CPU | SELF_HOSTED_CPU | SELF_HOSTED_GPU", required: true}
      purpose: {description: "QUALIFICATION | SCREENING | TRAINABILITY_PILOT | DATA_SEEDING | REGRESSION", required: true}
      requested_runs: {description: "Number of runs requested", required: false, default: "1"}
      requested_spend_usd: {description: "Spend requested in USD", required: false, default: "0"}
      gpu: {description: "true if a GPU will be used", required: false, default: "false"}
      provider_inference: {description: "true if network/provider inference will be used", required: false, default: "false"}
      threshold: {description: "Minimum passing score (0-100)", required: false, default: "40"}

permissions:
  contents: read

jobs:
  authorize:
    name: Verify model-execution authorization (no model is invoked here)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'workflow_dispatch'
    outputs:
      authorized: ${{ steps.gate.outputs.authorized }}
    steps:
      - name: Checkout the exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Orca (qualification extra provides the signature verifier)
        run: |
          pip install uv
          uv pip install --system -e ".[qualification]"
      - name: Fail-closed authorization gate
        id: gate
        env:
          EVAL_VERSION: ${{ github.event.inputs.eval_version }}
          CANDIDATE_MODEL_ID: ${{ github.event.inputs.candidate_model_id }}
          CANDIDATE_REVISION: ${{ github.event.inputs.candidate_revision }}
          EVAL_STAGE: ${{ github.event.inputs.stage }}
          RUNNER_CLASS: ${{ github.event.inputs.runner_class }}
          EVAL_PURPOSE: ${{ github.event.inputs.purpose }}
          REQUESTED_RUNS: ${{ github.event.inputs.requested_runs }}
          REQUESTED_SPEND_USD: ${{ github.event.inputs.requested_spend_usd }}
          REQUEST_GPU: ${{ github.event.inputs.gpu }}
          REQUEST_PROVIDER_INFERENCE: ${{ github.event.inputs.provider_inference }}
        run: python scripts/ci/verify_model_eval_authorization.py

  eval:
    name: Orneur Model Eval
    needs: authorize
    if: github.event_name == 'workflow_dispatch' && needs.authorize.outputs.authorized == 'true'
    runs-on: self-hosted   # requires a runner with Ollama installed
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Orca (no GPU deps)
        run: |
          pip install uv
          uv pip install --system -e ".[dev]" 2>/dev/null || uv pip install --system -e .

      - name: Check Ollama status
        run: |
          ollama --version
          ollama list

      - name: Determine model to evaluate
        id: model
        run: |
          MODEL="${{ github.event.inputs.candidate_model_id }}"
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"

      - name: Pull model if needed
        run: ollama pull ${{ steps.model.outputs.model }} || true

      - name: Run evaluation (accuracy + style, CI mode)
        run: |
          orca train eval \
            --ollama "${{ steps.model.outputs.model }}" \
            --n-accuracy 50 \
            --n-style 10 \
            --ci \
            --threshold "${{ github.event.inputs.threshold || '40' }}"

      - name: Check for eval regressions vs previous run
        run: |
          orca train regression \
            --model "${{ steps.model.outputs.model }}" \
            --ci
        # Self-hosted runner (see runs-on above) persists ~/.orca/training/eval/history
        # across runs, which is what makes this comparison meaningful — a fresh
        # ephemeral runner would have no prior history to compare against.

      - name: Run red-team safety suite (CI mode)
        run: |
          orca train redteam \
            --model "${{ steps.model.outputs.model }}" \
            --ci \
            --threshold "${{ github.event.inputs.safety_threshold || '85' }}"

      - name: Generate model card
        if: always()
        run: |
          VARIANT="${{ steps.model.outputs.model }}"
          VARIANT="${VARIANT#orca-}"
          orca train card "$VARIANT" || true

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ steps.model.outputs.model }}-${{ github.run_number }}
          path: ~/.orca/training/eval/eval_${{ steps.model.outputs.model }}.json
          retention-days: 90

      - name: Upload red-team report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redteam-report-${{ steps.model.outputs.model }}-${{ github.run_number }}
          path: ~/.orca/training/redteam/redteam_${{ steps.model.outputs.model }}.json
          retention-days: 90

      - name: Upload model card
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-card-${{ steps.model.outputs.model }}-${{ github.run_number }}
          path: ~/.orca/governance/model_cards/*.json
          retention-days: 365
