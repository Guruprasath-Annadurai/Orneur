name: Phase 14B Distributed Qualification

# Manual only -- this workflow connects to real staging Supabase
# backends and execs into the real Northflank orneur-api-a service.
# Never runs on pull_request/fork PR/push -- only an explicit,
# authorized dispatch, per Phase 14B's own gating rule.
on:
  workflow_dispatch:
    inputs:
      race_runs:
        description: "Number of one-use lease race iterations"
        required: false
        default: "10"
      fresh_runner_mode:
        description: "Spec Step 4 (fresh-runner/disposable-compute recovery): 'write' on this dispatch, terminate this runner, then 'read' on a SEPARATE later dispatch with the printed lease_id. 'health_check' for Step 17 (3x /livez + /readyz on the live Host A pod, never exposed publicly). 'cancellation' for Phase 14B.2 Step 18 (cancellation-only cloud qualification, both real hosts, no full scenario battery). 'northflank_inspect' for Phase 14C Step 2 (read-only project/service/quota listing, never mutates anything). Leave blank for the normal race+scenario battery."
        required: false
        default: ""
        type: choice
        options: ["", "write", "read", "health_check", "cancellation", "northflank_inspect", "create_edge_tunnel_service", "verify_tunnel_and_internal_reachability", "patch_edge_tunnel_command", "diagnose_api_a", "configure_api_a_path_ignore", "restart_edge_tunnel", "verify_public_edge", "inspect_api_a_env_keys_only", "configure_api_a_public_edge_env", "verify_edge_auth_tenancy", "configure_api_a_trusted_proxy", "verify_edge_controls_batch2", "secret_scope_review", "secret_leak_scan", "tunnel_outage_recovery", "origin_pod_recycle", "verify_cloudflare_access", "verify_waf_and_rate_limit"]
      fresh_runner_lease_id:
        description: "Only for fresh_runner_mode=read: the lease_id printed by the prior fresh_runner_mode=write dispatch."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: phase14b-distributed-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Host B (GitHub ephemeral runner) <-> Host A (Northflank)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase14b-staging
    env:
      ORNEUR_DEPLOYMENT_PROFILE: DISTRIBUTED
      ORNEUR_DATABASE_URL: ${{ secrets.ORNEUR_DATABASE_URL }}
      ORNEUR_GODMODE_DATABASE_URL: ${{ secrets.ORNEUR_GODMODE_DATABASE_URL }}
      ORNEUR_SECURITY_ROOT_DATABASE_URL: ${{ secrets.ORNEUR_SECURITY_ROOT_DATABASE_URL }}
      ORNEUR_AUDIT_KEY: ${{ secrets.ORNEUR_AUDIT_KEY }}
      ORNEUR_GODMODE_LEASE_SECRET: ${{ secrets.ORNEUR_GODMODE_LEASE_SECRET }}
      ORNEUR_AUTH_SECRET: ${{ secrets.ORNEUR_AUTH_SECRET }}
      NORTHFLANK_PROJECT: orneur-phase14b-staging
      NORTHFLANK_SERVICE: orneur-api-a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ORNEUR (Host B runtime, no local persistence)
        run: |
          pip install --no-cache-dir -e ".[postgres]"

      - name: Fail closed if required secrets are missing
        run: |
          for v in ORNEUR_DATABASE_URL ORNEUR_GODMODE_DATABASE_URL ORNEUR_SECURITY_ROOT_DATABASE_URL \
                   ORNEUR_AUDIT_KEY ORNEUR_GODMODE_LEASE_SECRET ORNEUR_AUTH_SECRET NORTHFLANK_API_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret $v is not set in the phase14b-staging environment -- refusing to run."
              exit 1
            fi
          done
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}

      - name: Authenticate Northflank CLI (least-privileged service token, never printed)
        run: |
          npx --yes @northflank/cli login --token-login --token "$NORTHFLANK_API_TOKEN" --name phase14b-ci --override
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}

      - name: Upload actor script to Host A (Northflank pod)
        run: |
          npx --yes @northflank/cli upload service file \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --localPath scripts/phase14b --remotePath /tmp/phase14b

      - name: Run distributed qualification (setup + N lease races + audit checks)
        if: github.event.inputs.fresh_runner_mode == ''
        run: |
          python3 scripts/phase14b/run_qualification.py --race-runs "${{ github.event.inputs.race_runs }}"

      - name: Run remaining distributed scenarios (session visibility, tenant isolation, security-root propagation, stale worker, outages, deadline, budget)
        if: github.event.inputs.fresh_runner_mode == ''
        run: |
          python3 scripts/phase14b/run_qualification.py --scenario all_scenarios

      - name: "Fresh-runner Step 4 (write): this runner creates durable lease + session state, then terminates"
        if: github.event.inputs.fresh_runner_mode == 'write'
        run: |
          cd scripts/phase14b
          python3 distributed_actor.py --role ORCHESTRATOR --run-id freshrunner-fixed --action cleanup
          LEASE_JSON=$(python3 distributed_actor.py --role HOST_B --run-id freshrunner-fixed --action setup_lease --max-uses 1)
          echo "$LEASE_JSON"
          LEASE_ID=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['lease_id'])" "$LEASE_JSON")
          python3 distributed_actor.py --role HOST_B --run-id freshrunner-fixed --action write_tenant_state --tenant-suffix fresh --role-label runner1
          echo "::notice::FRESH_RUNNER_LEASE_ID=$LEASE_ID -- pass this as fresh_runner_lease_id to a LATER, separate dispatch with fresh_runner_mode=read"

      - name: "Fresh-runner Step 4 (read): a completely separate, later runner recovers state + consumes the lease, then a replay attempt is denied"
        if: github.event.inputs.fresh_runner_mode == 'read'
        run: |
          cd scripts/phase14b
          echo "--- read durable session state written by the now-dead prior runner ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action read_tenant_state --tenant-suffix fresh --role-label runner2
          echo "--- fresh runner consumes the lease created by the now-dead prior runner ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action resolve_once --lease-id "${{ github.event.inputs.fresh_runner_lease_id }}" --principal-suffix runner2
          echo "--- yet another attempt to replay the SAME consumed lease must be denied ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action resolve_once --lease-id "${{ github.event.inputs.fresh_runner_lease_id }}" --principal-suffix runner3
          python3 distributed_actor.py --role ORCHESTRATOR --run-id freshrunner-fixed --action cleanup

      - name: "Phase 14C Step 2: read-only Northflank project/service/quota inspection (never mutates anything)"
        if: github.event.inputs.fresh_runner_mode == 'northflank_inspect'
        run: |
          echo "::group::Projects"
          npx --yes @northflank/cli list projects --noDefaults --output json
          echo "::endgroup::"
          echo "::group::Staging project detail"
          npx --yes @northflank/cli get project --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::Services in staging project"
          npx --yes @northflank/cli list services --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::orneur-api-a service detail"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::orneur-api-a ports"
          npx --yes @northflank/cli get service ports --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::endgroup::"

      - name: "Phase 14C Step 28: secret-scope review -- confirm orneur-api-a, orneur-edge-tunnel, and GitHub Actions never share a secret group (key names only, values never printed)"
        if: github.event.inputs.fresh_runner_mode == 'secret_scope_review'
        run: |
          set -e
          echo "::group::Project-level secret groups (names/IDs only)"
          npx --yes @northflank/cli list secrets --project "$NORTHFLANK_PROJECT" --noDefaults --output json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          items = d.get('secrets', d) if isinstance(d, dict) else d
          if isinstance(items, dict):
              items = items.get('secrets', [])
          for s in items:
              print(json.dumps({'id': s.get('id'), 'name': s.get('name'), 'priority': s.get('priority')}))
          "
          echo "::endgroup::"
          echo "::group::orneur-api-a -- linked secret groups (IDs/names only)"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-api-a --noDefaults --output json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(json.dumps(d.get('addonDependencies', d.get('secrets', 'n/a'))))
          "
          echo "::endgroup::"
          echo "::group::orneur-edge-tunnel -- linked secret groups (IDs/names only)"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          print(json.dumps(d.get('addonDependencies', d.get('secrets', 'n/a'))))
          "
          echo "::endgroup::"
          echo "::group::orneur-api-a direct env keys (already known non-secret -- ORNEUR_ALLOWED_ORIGINS/PUBLIC_EDGE/TRUSTED_HOSTS/TRUSTED_PROXY_CIDRS/APP_URL/PUBLIC_URL)"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service orneur-api-a --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "::group::orneur-edge-tunnel direct env keys (expect ONLY TUNNEL_TOKEN -- never a DB/audit/signing secret)"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "::group::GitHub Actions secrets used by THIS workflow (names only, from env: block above -- never re-printed with values)"
          echo '["NORTHFLANK_API_TOKEN", "ORNEUR_DATABASE_URL", "ORNEUR_GODMODE_DATABASE_URL", "ORNEUR_SECURITY_ROOT_DATABASE_URL", "ORNEUR_AUDIT_KEY", "ORNEUR_GODMODE_LEASE_SECRET", "ORNEUR_AUTH_SECRET"]'
          echo "(These are GitHub Actions repo/environment secrets, injected only into THIS ephemeral runner's env for local-regression/diagnostic steps -- never written to any Northflank service's runtime environment by this workflow. orneur-api-a gets its OWN copies of the DB/audit/signing secrets via its own linked Northflank secret group, a completely separate storage location from GitHub's secret store.)"
          echo "::endgroup::"

      - name: "Phase 14C Step 29: secret-leak scan -- grep this repo's tracked files and recent git history for anything secret-shaped"
        if: github.event.inputs.fresh_runner_mode == 'secret_leak_scan'
        run: |
          set -e
          echo "::group::Tracked files -- pattern scan (private keys, AWS-style keys, generic high-entropy 'secret'/'token'/'password' assignments, DB URLs with embedded credentials)"
          git grep -nIE "BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|(secret|token|password|api[_-]?key)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9+/_=-]{16,}['\"]|postgres(ql)?://[^:]+:[^@]+@" -- . ':(exclude)*.lock' ':(exclude)node_modules' ':(exclude).venv' || echo "(no matches)"
          echo "::endgroup::"
          echo "::group::Recent commit history (last 100 commits) -- same patterns, diff content"
          git log -p -100 -- . | grep -nIE "BEGIN (RSA|EC|OPENSSH|PGP) PRIVATE KEY|AKIA[0-9A-Z]{16}|(secret|token|password|api[_-]?key)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9+/_=-]{16,}['\"]|postgres(ql)?://[^:]+:[^@]+@" || echo "(no matches)"
          echo "::endgroup::"
          echo "::group::.env-shaped files tracked in git (should be none)"
          git ls-files | grep -E "^\.env($|\.[^.]+$)|\.env\.[a-z]+$" || echo "(none tracked)"
          echo "::endgroup::"
          echo "NEW_SECRET_LEAKAGE=0 if all three groups above show no matches / no tracked .env files."

      - name: "Phase 14C Step 2-3: create orneur-edge-tunnel (idempotent -- skips if it already exists, no application/DB/signing secrets attached)"
        if: github.event.inputs.fresh_runner_mode == 'create_edge_tunnel_service'
        run: |
          set -e
          EXISTING=$(npx --yes @northflank/cli list services --project "$NORTHFLANK_PROJECT" --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if any(s['id']=='orneur-edge-tunnel' for s in d.get('services',[])) else 'no')")
          if [ "$EXISTING" = "yes" ]; then
            echo "orneur-edge-tunnel already exists -- skipping creation (idempotent)."
          else
            cat > /tmp/edge-tunnel-service.json <<'JSON'
          {
            "name": "orneur-edge-tunnel",
            "billing": { "deploymentPlan": "nf-compute-20" },
            "deployment": {
              "instances": 1,
              "docker": { "configType": "customCommand", "customCommand": "tunnel --no-autoupdate run" },
              "external": { "imagePath": "cloudflare/cloudflared:latest" }
            }
          }
          JSON
            npx --yes @northflank/cli create service deployment -f /tmp/edge-tunnel-service.json --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          fi
          echo "::group::Service detail after create"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json
          echo "::endgroup::"

      - name: "Phase 14C fix: cloudflared 'tunnel run' requires an explicit --token argument (confirmed via Cloudflare's own docs -- TUNNEL_TOKEN alone was not sufficient)"
        if: github.event.inputs.fresh_runner_mode == 'patch_edge_tunnel_command'
        run: |
          set -e
          cat > /tmp/edge-tunnel-update.json <<'JSON'
          {
            "external": { "imagePath": "cloudflare/cloudflared:latest" },
            "docker": { "configType": "customCommand", "customCommand": "tunnel --no-autoupdate run --token $TUNNEL_TOKEN" }
          }
          JSON
          npx --yes @northflank/cli update service deployment -f /tmp/edge-tunnel-update.json --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json
          echo "::group::Service detail after patch"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('deployment',{}).get('docker',{}), indent=2))"
          echo "::endgroup::"
          echo "Waiting 20s for redeploy to roll out..."
          sleep 20
          echo "::group::orneur-edge-tunnel logs after patch (defensively redacted)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --lineLimit 40 --noDefaults 2>&1 | sed -E 's/(eyJ|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"

      - name: "Phase 14C: diagnose why orneur-api-a's own /livez self-check just started failing (exit 7, connection refused)"
        if: github.event.inputs.fresh_runner_mode == 'diagnose_api_a'
        run: |
          echo "::group::orneur-api-a deployment/build status"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'status': d.get('status'), 'deployedSHA': d.get('deployment',{}).get('internal',{}).get('deployedSHA'), 'instances': d.get('deployment',{}).get('instances')}, indent=2))"
          echo "::endgroup::"
          echo "::group::orneur-api-a logs (last 80 lines, secret-value patterns redacted defensively)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --lineLimit 80 --noDefaults 2>&1 | sed -E 's/(eyJ|postgresql:\/\/[^ "]*|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"
          echo "::group::retry /livez now"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s -o /dev/null -w '%{http_code}\n' http://localhost:7337/livez" || true
          echo "::endgroup::"

      - name: "Phase 14C: safe check -- is orneur-api-a's existing config a direct service env map or an inherited secret group? (KEY NAMES ONLY, values never read or printed)"
        if: github.event.inputs.fresh_runner_mode == 'inspect_api_a_env_keys_only'
        run: |
          set -e
          echo "::group::Direct (this service's own) runtime environment keys only"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "::group::Inherited (secret-group) runtime environment keys only"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show inherited --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"

      - name: "Phase 14C Step 7/9/10: set the public-edge env vars on orneur-api-a's OWN direct environment (confirmed empty/safe -- all real secrets are inherited from a separate secret group, untouched by this)"
        if: github.event.inputs.fresh_runner_mode == 'configure_api_a_public_edge_env'
        run: |
          set -e
          cat > /tmp/api-a-public-edge-env.json <<'JSON'
          {
            "runtimeEnvironment": {
              "ORNEUR_ALLOWED_ORIGINS": "https://staging.orneur.com",
              "ORNEUR_PUBLIC_EDGE": "1",
              "ORNEUR_TRUSTED_HOSTS": "staging.orneur.com",
              "APP_URL": "https://staging.orneur.com",
              "PUBLIC_URL": "https://staging.orneur.com"
            }
          }
          JSON
          npx --yes @northflank/cli update service runtime-environment -f /tmp/api-a-public-edge-env.json --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::group::Direct env keys after update (values never printed)"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "Waiting 25s for redeploy to roll out..."
          sleep 25
          echo "::group::Post-update self-check (authority_store/security_root/core_database must all remain ok)"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s http://localhost:7337/readyz"
          echo
          echo "::endgroup::"

      - name: "Phase 14C Step 11: fix missing HSTS + configure trusted-proxy so X-Forwarded-Proto/X-Forwarded-For are honored from the Cloudflare Tunnel connector (live finding: verify_public_edge showed strict-transport-security MISSING because uvicorn's forwarded_allow_ips defaulted to 127.0.0.1, which the tunnel connector -- a separate Northflank service -- never connects from)"
        if: github.event.inputs.fresh_runner_mode == 'configure_api_a_trusted_proxy'
        run: |
          set -e
          # Northflank does not publish a stable, documented CIDR for
          # its internal service-to-service networking (confirmed via
          # its own docs -- only BYOC cluster-provisioning defaults are
          # documented, not a fixed platform-wide range), so hardcoding
          # a guessed CIDR would be fragile and could silently stop
          # matching on a future redeploy. The REAL trust boundary here
          # is Northflank's own project-level private-port isolation --
          # already proven live in Step 9a/9b (direct origin unreachable
          # even with a spoofed Host header): nothing outside this
          # Northflank project can reach orneur-api-a:7337 at all, so
          # the only entity that can ever be the direct TCP peer for a
          # request reaching this service is something already inside
          # the project (today, only orneur-edge-tunnel). "*" tells both
          # uvicorn's ProxyHeadersMiddleware and orca.serve.ratelimit's
          # get_client_ip() to trust X-Forwarded-Proto/X-Forwarded-For
          # unconditionally -- correct given that precondition, and
          # re-uses the SAME env var (ORNEUR_TRUSTED_PROXY_CIDRS) both
          # code paths already read. This re-sends the full previously-
          # confirmed-safe direct env (see configure_api_a_public_edge_env
          # above -- inspect_api_a_env_keys_only proved this service's
          # own direct env holds only non-secret config, never real
          # secrets, which are inherited from a separate linked group)
          # plus this one new key, since runtime-environment updates
          # REPLACE the entire direct env map.
          cat > /tmp/api-a-trusted-proxy-env.json <<'JSON'
          {
            "runtimeEnvironment": {
              "ORNEUR_ALLOWED_ORIGINS": "https://staging.orneur.com",
              "ORNEUR_PUBLIC_EDGE": "1",
              "ORNEUR_TRUSTED_HOSTS": "staging.orneur.com",
              "APP_URL": "https://staging.orneur.com",
              "PUBLIC_URL": "https://staging.orneur.com",
              "ORNEUR_TRUSTED_PROXY_CIDRS": "*"
            }
          }
          JSON
          npx --yes @northflank/cli update service runtime-environment -f /tmp/api-a-trusted-proxy-env.json --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::group::Direct env keys after update (values never printed)"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "Waiting 25s for redeploy to roll out..."
          sleep 25
          echo "::group::Post-update self-check (authority_store/security_root/core_database must all remain ok)"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s http://localhost:7337/readyz"
          echo
          echo "::endgroup::"

      - name: "Phase 14C Steps 11/12/17/20: trusted-proxy live verification (HSTS now present), Host-header validation, request-size limit, SSRF-through-edge regression"
        if: github.event.inputs.fresh_runner_mode == 'verify_edge_controls_batch2'
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          echo "::group::Step 11 -- HSTS now present (proves X-Forwarded-Proto is honored from the tunnel connector)"
          curl -sS -A "$UA" -D - -o /dev/null https://staging.orneur.com/livez 2>&1 | grep -iE "strict-transport-security|x-content-type-options|referrer-policy|permissions-policy" || echo "(none of the expected headers were found)"
          echo "::endgroup::"

          echo "::group::Step 12 -- Host header validation: a spoofed Host through the real edge must not be served as if valid"
          echo "--- correct host (expect 200) ---"
          curl -sS -A "$UA" -o /dev/null -w 'status=%{http_code}\n' https://staging.orneur.com/livez -H "Host: staging.orneur.com" || true
          echo "--- spoofed host over the same TLS connection (Cloudflare routes by SNI regardless of the Host header value the client sends -- this checks what the ORIGIN does if it ever saw a mismatched Host, not whether Cloudflare's edge can be tricked into routing wrong) ---"
          curl -sS -A "$UA" -o /dev/null -w 'status=%{http_code}\n' https://staging.orneur.com/livez -H "Host: evil.invalid.example" || true
          echo "::endgroup::"

          echo "::group::Step 17 -- request-size limit: an oversized JSON body on a route with no per-route size check must be rejected (413), not silently buffered"
          python3 -c "
          import json
          print(json.dumps({'message': 'x' * (31 * 1024 * 1024), 'session_id': None}))
          " > /tmp/oversized_chat_body.json
