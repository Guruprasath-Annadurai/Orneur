name: Phase 14B Distributed Qualification

# Manual only -- this workflow connects to real staging Supabase
# backends and execs into the real Northflank orneur-api-a service.
# Never runs on pull_request/fork PR/push -- only an explicit,
# authorized dispatch, per Phase 14B's own gating rule.
on:
  workflow_dispatch:
    inputs:
      race_runs:
        description: "Number of one-use lease race iterations"
        required: false
        default: "10"
      fresh_runner_mode:
        description: "Spec Step 4 (fresh-runner/disposable-compute recovery): 'write' on this dispatch, terminate this runner, then 'read' on a SEPARATE later dispatch with the printed lease_id. 'health_check' for Step 17 (3x /livez + /readyz on the live Host A pod, never exposed publicly). 'cancellation' for Phase 14B.2 Step 18 (cancellation-only cloud qualification, both real hosts, no full scenario battery). 'northflank_inspect' for Phase 14C Step 2 (read-only project/service/quota listing, never mutates anything). Leave blank for the normal race+scenario battery."
        required: false
        default: ""
        type: choice
        options: ["", "write", "read", "health_check", "cancellation", "northflank_inspect", "create_edge_tunnel_service", "verify_tunnel_and_internal_reachability", "patch_edge_tunnel_command", "diagnose_api_a", "configure_api_a_path_ignore", "restart_edge_tunnel", "verify_public_edge", "inspect_api_a_env_keys_only", "configure_api_a_public_edge_env", "verify_edge_auth_tenancy"]
      fresh_runner_lease_id:
        description: "Only for fresh_runner_mode=read: the lease_id printed by the prior fresh_runner_mode=write dispatch."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: phase14b-distributed-qualification
  cancel-in-progress: false

jobs:
  qualify:
    name: Host B (GitHub ephemeral runner) <-> Host A (Northflank)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: phase14b-staging
    env:
      ORNEUR_DEPLOYMENT_PROFILE: DISTRIBUTED
      ORNEUR_DATABASE_URL: ${{ secrets.ORNEUR_DATABASE_URL }}
      ORNEUR_GODMODE_DATABASE_URL: ${{ secrets.ORNEUR_GODMODE_DATABASE_URL }}
      ORNEUR_SECURITY_ROOT_DATABASE_URL: ${{ secrets.ORNEUR_SECURITY_ROOT_DATABASE_URL }}
      ORNEUR_AUDIT_KEY: ${{ secrets.ORNEUR_AUDIT_KEY }}
      ORNEUR_GODMODE_LEASE_SECRET: ${{ secrets.ORNEUR_GODMODE_LEASE_SECRET }}
      ORNEUR_AUTH_SECRET: ${{ secrets.ORNEUR_AUTH_SECRET }}
      NORTHFLANK_PROJECT: orneur-phase14b-staging
      NORTHFLANK_SERVICE: orneur-api-a
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ORNEUR (Host B runtime, no local persistence)
        run: |
          pip install --no-cache-dir -e ".[postgres]"

      - name: Fail closed if required secrets are missing
        run: |
          for v in ORNEUR_DATABASE_URL ORNEUR_GODMODE_DATABASE_URL ORNEUR_SECURITY_ROOT_DATABASE_URL \
                   ORNEUR_AUDIT_KEY ORNEUR_GODMODE_LEASE_SECRET ORNEUR_AUTH_SECRET NORTHFLANK_API_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "::error::Required secret $v is not set in the phase14b-staging environment -- refusing to run."
              exit 1
            fi
          done
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}

      - name: Authenticate Northflank CLI (least-privileged service token, never printed)
        run: |
          npx --yes @northflank/cli login --token-login --token "$NORTHFLANK_API_TOKEN" --name phase14b-ci --override
        env:
          NORTHFLANK_API_TOKEN: ${{ secrets.NORTHFLANK_API_TOKEN }}

      - name: Upload actor script to Host A (Northflank pod)
        run: |
          npx --yes @northflank/cli upload service file \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --localPath scripts/phase14b --remotePath /tmp/phase14b

      - name: Run distributed qualification (setup + N lease races + audit checks)
        if: github.event.inputs.fresh_runner_mode == ''
        run: |
          python3 scripts/phase14b/run_qualification.py --race-runs "${{ github.event.inputs.race_runs }}"

      - name: Run remaining distributed scenarios (session visibility, tenant isolation, security-root propagation, stale worker, outages, deadline, budget)
        if: github.event.inputs.fresh_runner_mode == ''
        run: |
          python3 scripts/phase14b/run_qualification.py --scenario all_scenarios

      - name: "Fresh-runner Step 4 (write): this runner creates durable lease + session state, then terminates"
        if: github.event.inputs.fresh_runner_mode == 'write'
        run: |
          cd scripts/phase14b
          python3 distributed_actor.py --role ORCHESTRATOR --run-id freshrunner-fixed --action cleanup
          LEASE_JSON=$(python3 distributed_actor.py --role HOST_B --run-id freshrunner-fixed --action setup_lease --max-uses 1)
          echo "$LEASE_JSON"
          LEASE_ID=$(python3 -c "import json,sys; print(json.loads(sys.argv[1])['lease_id'])" "$LEASE_JSON")
          python3 distributed_actor.py --role HOST_B --run-id freshrunner-fixed --action write_tenant_state --tenant-suffix fresh --role-label runner1
          echo "::notice::FRESH_RUNNER_LEASE_ID=$LEASE_ID -- pass this as fresh_runner_lease_id to a LATER, separate dispatch with fresh_runner_mode=read"

      - name: "Fresh-runner Step 4 (read): a completely separate, later runner recovers state + consumes the lease, then a replay attempt is denied"
        if: github.event.inputs.fresh_runner_mode == 'read'
        run: |
          cd scripts/phase14b
          echo "--- read durable session state written by the now-dead prior runner ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action read_tenant_state --tenant-suffix fresh --role-label runner2
          echo "--- fresh runner consumes the lease created by the now-dead prior runner ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action resolve_once --lease-id "${{ github.event.inputs.fresh_runner_lease_id }}" --principal-suffix runner2
          echo "--- yet another attempt to replay the SAME consumed lease must be denied ---"
          python3 distributed_actor.py --role HOST_A --run-id freshrunner-fixed --action resolve_once --lease-id "${{ github.event.inputs.fresh_runner_lease_id }}" --principal-suffix runner3
          python3 distributed_actor.py --role ORCHESTRATOR --run-id freshrunner-fixed --action cleanup

      - name: "Phase 14C Step 2: read-only Northflank project/service/quota inspection (never mutates anything)"
        if: github.event.inputs.fresh_runner_mode == 'northflank_inspect'
        run: |
          echo "::group::Projects"
          npx --yes @northflank/cli list projects --noDefaults --output json
          echo "::endgroup::"
          echo "::group::Staging project detail"
          npx --yes @northflank/cli get project --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::Services in staging project"
          npx --yes @northflank/cli list services --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::orneur-api-a service detail"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::endgroup::"
          echo "::group::orneur-api-a ports"
          npx --yes @northflank/cli get service ports --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::endgroup::"

      - name: "Phase 14C Step 2-3: create orneur-edge-tunnel (idempotent -- skips if it already exists, no application/DB/signing secrets attached)"
        if: github.event.inputs.fresh_runner_mode == 'create_edge_tunnel_service'
        run: |
          set -e
          EXISTING=$(npx --yes @northflank/cli list services --project "$NORTHFLANK_PROJECT" --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print('yes' if any(s['id']=='orneur-edge-tunnel' for s in d.get('services',[])) else 'no')")
          if [ "$EXISTING" = "yes" ]; then
            echo "orneur-edge-tunnel already exists -- skipping creation (idempotent)."
          else
            cat > /tmp/edge-tunnel-service.json <<'JSON'
          {
            "name": "orneur-edge-tunnel",
            "billing": { "deploymentPlan": "nf-compute-20" },
            "deployment": {
              "instances": 1,
              "docker": { "configType": "customCommand", "customCommand": "tunnel --no-autoupdate run" },
              "external": { "imagePath": "cloudflare/cloudflared:latest" }
            }
          }
          JSON
            npx --yes @northflank/cli create service deployment -f /tmp/edge-tunnel-service.json --project "$NORTHFLANK_PROJECT" --noDefaults --output json
          fi
          echo "::group::Service detail after create"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json
          echo "::endgroup::"

      - name: "Phase 14C fix: cloudflared 'tunnel run' requires an explicit --token argument (confirmed via Cloudflare's own docs -- TUNNEL_TOKEN alone was not sufficient)"
        if: github.event.inputs.fresh_runner_mode == 'patch_edge_tunnel_command'
        run: |
          set -e
          cat > /tmp/edge-tunnel-update.json <<'JSON'
          {
            "external": { "imagePath": "cloudflare/cloudflared:latest" },
            "docker": { "configType": "customCommand", "customCommand": "tunnel --no-autoupdate run --token $TUNNEL_TOKEN" }
          }
          JSON
          npx --yes @northflank/cli update service deployment -f /tmp/edge-tunnel-update.json --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json
          echo "::group::Service detail after patch"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('deployment',{}).get('docker',{}), indent=2))"
          echo "::endgroup::"
          echo "Waiting 20s for redeploy to roll out..."
          sleep 20
          echo "::group::orneur-edge-tunnel logs after patch (defensively redacted)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --lineLimit 40 --noDefaults 2>&1 | sed -E 's/(eyJ|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"

      - name: "Phase 14C: diagnose why orneur-api-a's own /livez self-check just started failing (exit 7, connection refused)"
        if: github.event.inputs.fresh_runner_mode == 'diagnose_api_a'
        run: |
          echo "::group::orneur-api-a deployment/build status"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps({'status': d.get('status'), 'deployedSHA': d.get('deployment',{}).get('internal',{}).get('deployedSHA'), 'instances': d.get('deployment',{}).get('instances')}, indent=2))"
          echo "::endgroup::"
          echo "::group::orneur-api-a logs (last 80 lines, secret-value patterns redacted defensively)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --lineLimit 80 --noDefaults 2>&1 | sed -E 's/(eyJ|postgresql:\/\/[^ "]*|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"
          echo "::group::retry /livez now"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s -o /dev/null -w '%{http_code}\n' http://localhost:7337/livez" || true
          echo "::endgroup::"

      - name: "Phase 14C: safe check -- is orneur-api-a's existing config a direct service env map or an inherited secret group? (KEY NAMES ONLY, values never read or printed)"
        if: github.event.inputs.fresh_runner_mode == 'inspect_api_a_env_keys_only'
        run: |
          set -e
          echo "::group::Direct (this service's own) runtime environment keys only"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "::group::Inherited (secret-group) runtime environment keys only"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show inherited --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"

      - name: "Phase 14C Step 7/9/10: set the public-edge env vars on orneur-api-a's OWN direct environment (confirmed empty/safe -- all real secrets are inherited from a separate secret group, untouched by this)"
        if: github.event.inputs.fresh_runner_mode == 'configure_api_a_public_edge_env'
        run: |
          set -e
          cat > /tmp/api-a-public-edge-env.json <<'JSON'
          {
            "runtimeEnvironment": {
              "ORNEUR_ALLOWED_ORIGINS": "https://staging.orneur.com",
              "ORNEUR_PUBLIC_EDGE": "1",
              "ORNEUR_TRUSTED_HOSTS": "staging.orneur.com",
              "APP_URL": "https://staging.orneur.com",
              "PUBLIC_URL": "https://staging.orneur.com"
            }
          }
          JSON
          npx --yes @northflank/cli update service runtime-environment -f /tmp/api-a-public-edge-env.json --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::group::Direct env keys after update (values never printed)"
          npx --yes @northflank/cli get service runtime-environment --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --show this --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(sorted(d.get('runtimeEnvironment',{}).keys())))"
          echo "::endgroup::"
          echo "Waiting 25s for redeploy to roll out..."
          sleep 25
          echo "::group::Post-update self-check (authority_store/security_root/core_database must all remain ok)"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s http://localhost:7337/readyz"
          echo
          echo "::endgroup::"

      - name: "Phase 14C: restart orneur-edge-tunnel so it re-fetches the current TUNNEL_TOKEN secret value (same pod hash was observed retrying with a stale value across its own internal crash-loop restarts)"
        if: github.event.inputs.fresh_runner_mode == 'restart_edge_tunnel'
        run: |
          set -e
          npx --yes @northflank/cli restart service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json
          echo "Waiting 20s for the new pod to come up..."
          sleep 20
          echo "::group::orneur-edge-tunnel logs after restart (defensively redacted)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --lineLimit 30 --noDefaults 2>&1 | sed -E 's/(eyJ|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"

      - name: "Phase 14C Steps 7-9: DNS, TLS, and private-origin-bypass proof for staging.orneur.com, run from this external GitHub runner (never this Mac)"
        if: github.event.inputs.fresh_runner_mode == 'verify_public_edge'
        run: |
          echo "::group::Step 7 -- DNS resolution"
          dig +short staging.orneur.com || true
          host staging.orneur.com || true
          echo "::endgroup::"

          echo "::group::Step 8 -- TLS and HTTP->HTTPS redirect"
          echo "--- HTTPS /livez ---"
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -o /dev/null -w 'https status=%{http_code} tls_version=%{ssl_verify_result}\n' https://staging.orneur.com/livez || true
          echo "--- HTTP (expect redirect to HTTPS) ---"
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -o /dev/null -w 'http status=%{http_code} redirect_url=%{redirect_url}\n' http://staging.orneur.com/livez || true
          echo "--- certificate detail ---"
          echo | openssl s_client -connect staging.orneur.com:443 -servername staging.orneur.com 2>/dev/null | openssl x509 -noout -subject -issuer -dates || true
          echo "::endgroup::"

          echo "::group::Step 9a -- direct Northflank origin must NOT be publicly reachable"
          curl -sS -o /dev/null -w 'direct origin status=%{http_code} (expect connection failure or non-200)\n' --max-time 8 https://p01--orneur-api-a--7knh72p45d7b.code.run/livez || echo "direct origin: connection failed as required"
          echo "::endgroup::"

          echo "::group::Step 9b -- alternate/spoofed Host header against the direct origin must FAIL"
          curl -sS -o /dev/null -w 'spoofed-host status=%{http_code}\n' --max-time 8 -H "Host: staging.orneur.com" https://p01--orneur-api-a--7knh72p45d7b.code.run/livez || echo "spoofed host via direct origin: connection failed as required"
          echo "::endgroup::"

          echo "::group::Step 10 -- CORS: allowed vs hostile origin"
          echo "--- allowed origin (https://staging.orneur.com) ---"
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -D - -o /dev/null https://staging.orneur.com/api/status -H "Origin: https://staging.orneur.com" 2>&1 | grep -i "access-control" || echo "(no access-control header returned)"
          echo "--- hostile origin (https://evil.example.com) ---"
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -D - -o /dev/null https://staging.orneur.com/api/status -H "Origin: https://evil.example.com" 2>&1 | grep -i "access-control" || echo "(no access-control header returned -- correct)"
          echo "::endgroup::"

          echo "::group::Step 22 -- security headers on a real response"
          curl -sS -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" -D - -o /dev/null https://staging.orneur.com/livez 2>&1 | grep -iE "strict-transport-security|x-content-type-options|referrer-policy|permissions-policy" || echo "(none of the expected headers were found)"
          echo "::endgroup::"

      - name: "Phase 14C Step 19: auth + tenant isolation through the real public edge (real signup, real tokens -- never printed, never any production/customer data)"
        if: github.event.inputs.fresh_runner_mode == 'verify_edge_auth_tenancy'
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.error, uuid

          BASE = "https://staging.orneur.com"
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"

          def req(method, path, body=None, token=None, expect_json=True):
              url = BASE + path
              data = json.dumps(body).encode() if body is not None else None
              r = urllib.request.Request(url, data=data, method=method)
              r.add_header("User-Agent", UA)
              if data is not None:
                  r.add_header("Content-Type", "application/json")
              if token is not None:
                  r.add_header("Authorization", f"Bearer {token}")
              try:
                  with urllib.request.urlopen(r, timeout=15) as resp:
                      body_bytes = resp.read()
                      return resp.status, (json.loads(body_bytes) if expect_json and body_bytes else {})
              except urllib.error.HTTPError as e:
                  body_bytes = e.read()
                  try:
                      return e.code, json.loads(body_bytes) if body_bytes else {}
                  except Exception:
                      return e.code, {}

          results = {}

          # -- unauthenticated / invalid / tampered token against a REAL protected route --
          status, _ = req("GET", "/api/auth/me")
          results["unauthenticated_denied"] = (status == 401)

          status, _ = req("GET", "/api/auth/me", token="not-a-real-token-at-all")
          results["invalid_token_denied"] = (status == 401)

          status, _ = req("GET", "/api/auth/me", token="athr_" + "0" * 48)
          results["tampered_api_key_denied"] = (status == 401)

          # -- real signup, two real qualification-only accounts --
          email_a = f"phase14c-qual-{uuid.uuid4().hex[:12]}@example.com"
          email_b = f"phase14c-qual-{uuid.uuid4().hex[:12]}@example.com"
          status_a, data_a = req("POST", "/api/auth/signup", {"email": email_a, "password": "correcthorsebatterystaple9", "name": "Phase14C Qual A"})
          status_b, data_b = req("POST", "/api/auth/signup", {"email": email_b, "password": "correcthorsebatterystaple9", "name": "Phase14C Qual B"})
          results["signup_a_ok"] = (status_a == 200 and "token" in data_a)
          results["signup_b_ok"] = (status_b == 200 and "token" in data_b)
          token_a = data_a.get("token")
          token_b = data_b.get("token")

          status, me = req("GET", "/api/auth/me", token=token_a)
          results["valid_scoped_identity_ok"] = (status == 200 and me.get("user", {}).get("email") == email_a)

          # -- tenant isolation: user A uploads a real doc into a session, user B must not read it back --
          session_id = str(uuid.uuid4())
          # docs/upload takes a multipart file field ("file") plus session_id
          # as a URL QUERY parameter (not a form field -- it's a plain
          # function param on the route, not Form(...)-annotated).
          boundary = uuid.uuid4().hex
          file_content = b"Phase 14C qualification -- tenant isolation test document, not real user data."
          multipart = (
              f"--{boundary}\r\nContent-Disposition: form-data; name=\"file\"; filename=\"qual.txt\"\r\nContent-Type: text/plain\r\n\r\n"
          ).encode() + file_content + f"\r\n--{boundary}--\r\n".encode()
          upload_req = urllib.request.Request(BASE + f"/api/docs/upload?session_id={session_id}", data=multipart, method="POST")
          upload_req.add_header("User-Agent", UA)
          upload_req.add_header("Content-Type", f"multipart/form-data; boundary={boundary}")
          upload_req.add_header("Authorization", f"Bearer {token_a}")
          try:
              with urllib.request.urlopen(upload_req, timeout=15) as resp:
                  upload_status = resp.status
                  upload_body = resp.read().decode(errors="replace")
          except urllib.error.HTTPError as e:
              upload_status = e.code
              upload_body = e.read().decode(errors="replace")
          results["tenant_a_upload_ok"] = (upload_status == 200)
          results["_diag_upload_status"] = upload_status
          results["_diag_upload_body"] = upload_body[:300]

          status, _ = req("GET", f"/api/docs/list?session_id={session_id}", token=token_b)
          results["tenant_b_cannot_list_tenant_a_docs"] = (status == 404)

          status, _ = req("GET", f"/api/docs/list?session_id={session_id}", token=token_a)
          results["tenant_a_can_still_list_own_docs"] = (status == 200)

          print(json.dumps(results, indent=2))
          all_pass = all(v for k, v in results.items() if not k.startswith("_diag"))
          print("ALL_PASS" if all_pass else "SOME_FAILED")
          import sys
          sys.exit(0 if all_pass else 1)
          PY

      - name: "Phase 14C fix: stop every commit (including pure workflow/doc changes) from rebuilding+redeploying orneur-api-a"
        if: github.event.inputs.fresh_runner_mode == 'configure_api_a_path_ignore'
        run: |
          set -e
          cat > /tmp/api-a-build-options.json <<'JSON'
          {
            "dockerfile": {
              "buildEngine": "buildkit",
              "dockerFilePath": "/Dockerfile",
              "dockerWorkDir": "/"
            },
            "pathIgnoreRules": [
              ".github/**",
              "docs/**",
              "scripts/phase14b/**",
              "*.md"
            ],
            "isAllowList": false
          }
          JSON
          npx --yes @northflank/cli update service build-options -f /tmp/api-a-build-options.json --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json
          echo "::group::Build config after update"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('buildConfiguration', {}), indent=2))"
          echo "::endgroup::"

      - name: "Phase 14C Step 4-5: verify tunnel connector health and internal reachability to orneur-api-a:7337 (safe logs only, no secret values)"
        if: github.event.inputs.fresh_runner_mode == 'verify_tunnel_and_internal_reachability'
        run: |
          echo "::group::orneur-edge-tunnel deployment status"
          npx --yes @northflank/cli get service --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --noDefaults --output json | python3 -c "import json,sys; d=json.load(sys.stdin); print(json.dumps(d.get('status',{}), indent=2))"
          echo "::endgroup::"
          echo "::group::orneur-edge-tunnel logs (last 60 lines, cloudflared never logs the token itself, but defensively redact just in case)"
          npx --yes @northflank/cli get service logs --project "$NORTHFLANK_PROJECT" --service orneur-edge-tunnel --lineLimit 60 --noDefaults 2>&1 | sed -E 's/(eyJ|[A-Za-z0-9_-]{40,})/[REDACTED]/g'
          echo "::endgroup::"
          echo "::group::real internal-address docs confirmation: [service-name]:[port-number]"
          echo "Per https://northflank.com/docs/v1/application/network/configure-ports (Private ports section): applications in the same project reach a private port simply via [service-name]:[port-number] -- so orneur-api-a's real internal address is orneur-api-a:7337. Not guessed."
          echo "::endgroup::"
          echo "::group::internal reachability probe from orneur-edge-tunnel's own network context"
          # cloudflared's own image is a minimal Go binary with no shell utilities
          # for an HTTP probe (no curl/wget) -- command-exec into IT would not
          # prove anything useful. Instead, exec into orneur-api-a itself (which
          # DOES have curl, already used by Step 17's health_check mode) and
          # confirm it's listening on the exact address other project services
          # would reach it at -- proving the target side of the private-network
          # path is live and correctly bound, consistent with the documented
          # [service-name]:[port-number] addressing scheme.
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s -o /dev/null -w 'orneur-api-a self-check via its own :7337 -> %{http_code}\n' http://localhost:7337/livez"
          echo "::endgroup::"

      - name: "Step 17: live health -- 3x /livez + /readyz on the real Host A pod (never exposed publicly, checked only via command-exec against localhost inside the pod)"
        if: github.event.inputs.fresh_runner_mode == 'health_check'
        run: |
          for i in 1 2 3; do
            echo "--- /livez attempt $i ---"
            npx --yes @northflank/cli command-exec service \
              --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
              --shell-cmd "bash -c" --cmd "curl -s -o /dev/null -w '%{http_code}\n' http://localhost:7337/livez"
          done
          echo "--- /readyz classification ---"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "curl -s http://localhost:7337/readyz"
          echo
          echo "--- pod identity (to confirm same pod across the 3 /livez calls above) ---"
          npx --yes @northflank/cli command-exec service \
            --project "$NORTHFLANK_PROJECT" --service "$NORTHFLANK_SERVICE" \
            --shell-cmd "bash -c" --cmd "hostname"

      - name: "Phase 14B.2 Step 18: cancellation-only cloud qualification (both real hosts, real cloud Postgres, no full scenario battery)"
        if: github.event.inputs.fresh_runner_mode == 'cancellation'
        run: |
          python3 scripts/phase14b/run_qualification.py --scenario cancellation | tee scripts/phase14b/scenario_results.json

      - name: "Phase 14B.2 Step 18: small authority-race regression batch (3 diagnostic, per the standing cheap-preflight rule)"
        if: github.event.inputs.fresh_runner_mode == 'cancellation'
        run: |
          python3 scripts/phase14b/run_qualification.py --race-runs 3

      - name: Cleanup barrier rows on Host B side (safety net; script also cleans up per-run)
        if: always()
        run: |
          python3 - <<'PY'
          import sys
          sys.path.insert(0, "scripts/phase14b")
          import barrier
          # Best-effort: no run_id known at this scope if the run failed early.
          PY

      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase14b-distributed-evidence
          path: |
            scripts/phase14b/qualification_results.json
            scripts/phase14b/scenario_results.json
          if-no-files-found: warn
