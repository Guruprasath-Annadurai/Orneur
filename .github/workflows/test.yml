name: Test Suite

on:
  push:
    branches:
      - main
      - session-update-2026-08-25
      - 'phase14b-*'
  pull_request:
    branches:
      - main
      - session-update-2026-08-25

jobs:
  pytest:
    name: Deterministic Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Orca (dev + mcp + nvidia extras -- no GPU/Ollama needed)
        # Phase 15.15 CI truthfulness closure: the deterministic suite
        # includes tests/test_distill.py (needs `openai`, from the
        # `nvidia` extra), tests/test_mcp_fs_server_sandbox.py (a
        # SECURITY-relevant path-traversal regression, needs `mcp`,
        # from the `mcp` extra), and a real number of tests exercising
        # orca.mission/orca.godmode/orca.auth Postgres-backed code
        # paths (needs `psycopg`, from the `postgres` extra) -- all
        # lightweight, pure-Python (or pure-C-extension) at install
        # time, no GPU/network/live-service dependency, and must
        # genuinely execute in this job rather than being silently
        # uncollectable/erroring on import. Discovered ONLY once the CI
        # pipefail fix (below) stopped masking these as false-green.
        # tests/test_train_losses.py (needs `torch`) is deliberately
        # NOT installed here -- it runs in the separate, dedicated
        # `torch-loss-tests` job below instead of pulling torch into
        # every regular test run.
        run: |
          pip install uv
          uv pip install --system -e ".[dev,mcp,nvidia,postgres]"

      - name: Run deterministic test suite
        run: bash scripts/ci/run_deterministic_tests.sh

      - name: Upload test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ github.run_number }}
          path: /tmp/pytest-log.txt
          retention-days: 14

  torch-loss-tests:
    name: Training Math Unit Tests (Torch)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Orca (dev) + CPU-only torch
        # Phase 15.15 CI truthfulness closure: tests/test_train_losses.py
        # is real, deterministic torch tensor math (no GPU, no network,
        # no model weights) -- it was previously uncollectable in CI
        # because torch was never installed anywhere. A dedicated,
        # bounded job (rather than folding the whole heavyweight `train`
        # extra -- unsloth/trl/transformers/accelerate/etc. -- into the
        # main deterministic job) keeps the common case fast while still
        # making this required and genuinely green. The CPU wheel index
        # keeps the install small (no CUDA payload) on this GPU-less
        # runner.
        run: |
          pip install uv
          uv pip install --system -e ".[dev]"
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Run training-math regression
        run: |
          set -euo pipefail
          pytest tests/test_train_losses.py -v

  container-build:
    name: Production Container Build + Boot Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build production Docker image
        run: docker build --pull --tag orneur-ci:${{ github.sha }} .

      - name: Inspect image metadata
        run: |
          docker image inspect orneur-ci:${{ github.sha }} \
            --format 'id={{.Id}} size={{.Size}} health={{json .Config.Healthcheck}} cmd={{json .Config.Cmd}}'

      - name: Boot image and verify /livez
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name orneur-ci-runtime -p 127.0.0.1:7337:7337 orneur-ci:${{ github.sha }}
          trap 'docker logs orneur-ci-runtime || true; docker rm -f orneur-ci-runtime >/dev/null 2>&1 || true' EXIT

          ok=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:7337/livez > /tmp/livez.json; then
              ok=1
              break
            fi
            if ! docker inspect -f '{{.State.Running}}' orneur-ci-runtime | grep -q true; then
              echo 'Container exited before liveness became available.' >&2
              exit 1
            fi
            sleep 1
          done

          if [ "$ok" -ne 1 ]; then
            echo 'Timed out waiting for /livez.' >&2
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/livez.json').read_text())
          assert payload.get('status') == 'alive', payload
          print('container_livez=PASS')
          PY

  security-audit:
    # Phase 15.15 item 10: this job's name is explicit about scope --
    # it audits only the BASE `-e .` install (no dev/mcp/nvidia/train
    # extras), which is a NARROWER dependency set than a full local
    # development `.venv` (which typically accumulates extras and
    # tooling over time). Its finding count is therefore not directly
    # comparable to a broader environment's pip-audit run -- see
    # docs/orneur/phase-15/PHASE15_EVIDENCE.md's Phase 15.15 evidence
    # for that explicit reconciliation. This job remains INFORMATIONAL
    # (`pip-audit || true`), never silently treated as a security PASS.
    name: Dependency Vulnerability Scan (informational, base install only)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Orca + pip-audit
        run: |
          pip install uv
          uv pip install --system -e .
          pip install pip-audit

      # Informational, not blocking: as of docs/SECURITY_AUDIT.md, chromadb
      # (PYSEC-2026-311) and diskcache (PYSEC-2026-2447) have known,
      # unpatched CVEs that were assessed and found NOT currently
      # exploitable given Orca's actual usage (embedded/local-only, no
      # network exposure) — see that doc for the full reasoning. This job
      # exists to catch any NEW vulnerability, not to re-litigate those two
      # every run; a human should review new findings before this becomes
      # a hard gate.
      - name: Run pip-audit (informational)
        run: pip-audit || true
